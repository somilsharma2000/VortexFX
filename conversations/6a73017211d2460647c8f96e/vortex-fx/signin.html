<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORTREX — Verifying Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06070A;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .verify-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      max-width: 400px;
      padding: 40px 24px;
    }

    .verify-logo {
      width: 56px;
      height: 56px;
    }

    .verify-logo svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px rgba(229, 193, 88, 0.3));
    }

    .verify-status {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
    }

    .verify-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(229, 193, 88, 0.15);
      border-top-color: #E5C158;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .verify-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .verify-error h2 {
      font-size: 18px;
      font-weight: 400;
      color: #fff;
      letter-spacing: 1px;
    }

    .verify-error p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.6;
    }

    .verify-error a {
      display: inline-block;
      padding: 14px 28px;
      background: #E5C158;
      color: #06070A;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    .verify-error a:hover {
      background: #F0CE6A;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(229, 193, 88, 0.25);
    }

    .verify-retry {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .verify-retry:hover {
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <!-- Logo -->
    <div class="verify-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L56 14 L56 32 C56 46 44 56 32 60 C20 56 8 46 8 32 L8 14 Z"
          stroke="#E5C158" stroke-width="1.5" fill="none" opacity="0.4"/>
        <path d="M22 18 L42 18 L42 24 L28 24 L28 30 L38 30 L38 36 L28 36 L28 46 L22 46 Z"
          fill="#E5C158"/>
      </svg>
    </div>

    <!-- Loading state -->
    <div id="loadingState" style="display:flex; flex-direction:column; align-items:center; gap:20px;">
      <div class="verify-spinner"></div>
      <p class="verify-status">Verifying access...</p>
    </div>

    <!-- Error state -->
    <div class="verify-error" id="errorState">
      <h2 id="errorTitle">Access Denied</h2>
      <p id="errorMessage"></p>
      <a id="discordInvite" href="https://discord.gg/9pTSqeTbn" style="display:none;">Join the Citadel Discord</a>
      <a class="verify-retry" href="index.html">← Back to entrance</a>
    </div>
  </div>

  <script src="js/auth.js?v=5"></script>
  <script>
    (async function() {
      const loading = document.getElementById('loadingState');
      const error = document.getElementById('errorState');
      const errorTitle = document.getElementById('errorTitle');
      const errorMessage = document.getElementById('errorMessage');
      const inviteLink = document.getElementById('discordInvite');

      // Check if this is a Discord OAuth callback
      const result = await FORTREX_AUTH.handleCallback();

      if (result && result.success) {
        // Success — redirect to dashboard
        window.location.href = 'dashboard.html';
        return;
      }

      // Show error
      loading.style.display = 'none';
      error.style.display = 'flex';

      if (result && result.needs_guild) {
        errorTitle.textContent = 'Join the Citadel';
        errorMessage.textContent = 'You must be a member of our Discord server to enter FORTREX.';
        inviteLink.style.display = 'inline-block';
      } else if (result && result.error) {
        errorTitle.textContent = 'Verification Failed';
        errorMessage.textContent = result.error;
      } else {
        // No callback — direct visit, send back to index
        window.location.href = 'index.html';
        return;
      }
    })();
  </script>
</body>
</html>
