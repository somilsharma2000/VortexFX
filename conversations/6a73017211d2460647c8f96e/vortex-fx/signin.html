<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORTEX FX — Access Terminal | Sign In</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/dala.css">
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <!-- TOP LEFT LOGO ONLY -->
  <div style="position: absolute; top: 36px; left: 40px; z-index: 100;">
    <a href="index.html" class="nav-brand">
      <div class="nav-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="12,2 22,20 2,20" stroke="#8052ff" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <span class="nav-wordmark">FORTEX FX</span>
    </a>
  </div>

  <!-- CENTERED AUTH TERMINAL -->
  <div class="auth-container">
    <div class="auth-form">

      <!-- CENTER LOGO -->
      <div style="text-align: center; margin-bottom: 32px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto 12px; display: block;">
          <polygon points="12,2 22,20 2,20" stroke="#8052ff" stroke-width="2" fill="none"/>
        </svg>
        <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.025em; text-transform: uppercase; color: #ffffff;">FORTEX FX</span>
      </div>

      <h1 class="auth-title" style="text-align: center;">Access Terminal</h1>
      <p class="auth-subtitle" style="text-align: center;">Sign in to enter the arena</p>

      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div style="margin-bottom: 24px;">
          <input type="email" class="auth-input" placeholder="Commander Email" required />
        </div>

        <div style="margin-bottom: 24px;">
          <input type="password" class="auth-input" placeholder="Access Code" required />
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; font-size: 14px;">
          <label style="color: #9a9a9a; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 200;">
            <input type="checkbox" style="accent-color: #8052ff;" /> Remember me
          </label>
          <a href="#" class="btn-ghost" style="color: #8052ff; text-transform: none; font-size: 14px;">Forgot access code?</a>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; text-align: center; justify-content: center;">ENTER ARENA</button>
      </form>

      <div class="auth-divider">
        <span>OR CONNECT VIA</span>
      </div>

      <div style="display: flex; justify-content: center; gap: 32px; margin-bottom: 36px;">
        <a href="#" class="btn-ghost" style="color: #9a9a9a; text-transform: none; font-size: 14px;">Google</a>
        <a href="#" class="btn-ghost" style="color: #9a9a9a; text-transform: none; font-size: 14px;">Discord</a>
        <a href="#" class="btn-ghost" style="color: #9a9a9a; text-transform: none; font-size: 14px;">X</a>
      </div>

      <div style="text-align: center; font-size: 14px; color: #9a9a9a; margin-bottom: 48px;">
        New to Fortex FX? <a href="#" style="color: #8052ff; font-weight: 600;">Create your account</a>
      </div>

      <div style="text-align: center; font-size: 12px; color: #4a4a4a;">
        256-bit quantum encryption
      </div>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/dala.js"></script>
  <script>
    new ParticleField('particle-canvas', { shape: 'fortress', particleCount: 60, ambientCount: 25 });
  </script>
</body>
</html>
