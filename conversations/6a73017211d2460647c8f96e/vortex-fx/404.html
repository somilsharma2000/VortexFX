<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Liquidated — FORTREX FX</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- System Styles and Scripts -->
  <link rel="stylesheet" href="css/dala.css">
  <script src="js/dala.js"></script>
  <script src="js/auth.js"></script>

  <style>
    :root {
      --bg-black: #000000;
      --bg-dark: #0a0a0a;
      --gold-accent: #D4AF37;
      --purple-accent: #8B5CF6;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --font-body: 'Inter', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      background-image: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #000000 100%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Particle Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* App Wrapper */
    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* Minimal Navbar */
    .minimal-nav {
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo-svg {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
    }

    .nav-wordmark {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      background: linear-gradient(135deg, #FFFFFF 0%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 404 Main Hero Container */
    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      color: var(--gold-accent);
      background: linear-gradient(180deg, #F5D77F 0%, #D4AF37 60%, #997A15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
      margin-bottom: 16px;
      letter-spacing: -0.04em;
    }

    .error-title {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .error-description {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    .btn-gold-pill {
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #000000;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14px;
      padding: 14px 36px;
      border-radius: 9999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-gold-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
      background: linear-gradient(135deg, #E5C158 0%, #C4921B 100%);
    }

    /* Minimal Footer */
    .minimal-footer {
      padding: 30px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 12px;
      color: #475569;
      font-family: var(--font-mono);
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 90px;
      }
      .error-title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Particle Canvas -->
  <canvas id="particle-canvas"></canvas>

  <div class="page-wrapper">
    <!-- Minimal Nav with FORTREX FX Logo -->
    <nav class="minimal-nav">
      <a href="index.html" class="nav-brand">
        <svg class="nav-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
          <polygon points="50,30 65,39 65,61 50,70 35,61 35,39" stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linejoin="round" opacity="0.6"/>
          <path d="M50,42 Q58,45 55,52 Q48,55 45,48 Q47,43 50,42" stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="2.5" fill="#D4AF37"/>
          <circle cx="50" cy="18" r="3" fill="#D4AF37"/>
          <circle cx="78" cy="34" r="3" fill="#D4AF37"/>
          <circle cx="78" cy="66" r="3" fill="#D4AF37"/>
          <circle cx="50" cy="82" r="3" fill="#D4AF37"/>
          <circle cx="22" cy="66" r="3" fill="#D4AF37"/>
          <circle cx="22" cy="34" r="3" fill="#D4AF37"/>
        </svg>
        <span class="nav-wordmark">FORTREX FX</span>
      </a>
    </nav>

    <!-- Main Content -->
    <main class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">This page got liquidated.</h1>
      <p class="error-description">
        The page you're looking for doesn't exist — or it's been sealed until launch.
      </p>
      <a href="index.html" class="btn-gold-pill">
        ← BACK TO SAFETY
      </a>
    </main>

    <!-- Minimal Footer -->
    <footer class="minimal-footer">
      © 2026 FORTREX FX. All rights reserved.
    </footer>
  </div>

  <script>
    // Particle Canvas Animation
    function initParticleCanvas() {
      const canvas = document.getElementById('particle-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const numParticles = 35;

      for (let i = 0; i < numParticles; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: Math.random() * 2 + 0.8,
          color: Math.random() > 0.4 ? 'rgba(212, 175, 55, ' : 'rgba(139, 92, 246, ',
          alpha: Math.random() * 0.5 + 0.15
        });
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color + p.alpha + ')';
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(draw);
      }

      draw();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initParticleCanvas();
    });
  </script>
</body>
</html>
