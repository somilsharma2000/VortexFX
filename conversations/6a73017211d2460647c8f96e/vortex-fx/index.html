<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORTREX</title>
  <meta name="description" content="FORTREX">
  <meta property="og:title" content="FORTREX">
  <meta property="og:description" content="FORTREX">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/fortrex-theme.css">
  <link rel="stylesheet" href="css/dala.css?v=5">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06070A;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background animation canvas */
    #dala-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Stealth content container */
    .stealth-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 500px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }

    /* Logo — clean, premium, isolated from animation */
    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      isolation: isolate;
      z-index: 20;
    }

    .logo-backdrop {
      position: absolute;
      width: 96px;
      height: 96px;
      background: rgba(6, 7, 10, 0.85);
      border-radius: 50%;
      filter: blur(8px);
      z-index: -1;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      position: relative;
      z-index: 21;
      shape-rendering: geometricPrecision;
    }

    .logo-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(229, 193, 88, 0.3));
    }

    /* Brand name */
    .brand-name {
      font-size: 32px;
      font-weight: 200;
      letter-spacing: 12px;
      color: #fff;
      margin-bottom: 8px;
      padding-left: 12px; /* compensate for letter-spacing */
    }

    /* Tagline */
    .stealth-tagline {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 48px;
    }

    /* Auth buttons */
    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .btn-discord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      background: #E5C158;
      color: #06070A;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .btn-discord:hover {
      background: #F0CE6A;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(229, 193, 88, 0.25);
    }

    .btn-discord svg {
      width: 20px;
      height: 20px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .btn-google:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.03);
      transform: translateY(-2px);
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
    }

    /* Loading state */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #06070A;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(229, 193, 88, 0.15);
      border-top-color: #E5C158;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Already logged in — redirect */
    .redirect-notice {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 24px;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .brand-name {
        font-size: 26px;
        letter-spacing: 8px;
      }
      .stealth-tagline {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Background animation -->
  <canvas id="dala-canvas"></canvas>

  <!-- Loading overlay (shown while checking auth) -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
  </div>

  <!-- Stealth mode content -->
  <div class="stealth-container" id="stealthContent" style="display: none;">
    <!-- Logo — F monogram in shield, clean gold strokes -->
    <div class="logo-wrap">
      <div class="logo-backdrop"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Shield outline -->
          <path d="M32 4 L56 14 L56 32 C56 46 44 56 32 60 C20 56 8 46 8 32 L8 14 Z"
            stroke="#E5C158" stroke-width="1.5" fill="none" opacity="0.4"/>
          <!-- F monogram — two angular strokes -->
          <path d="M22 18 L42 18 L42 24 L28 24 L28 30 L38 30 L38 36 L28 36 L28 46 L22 46 Z"
            fill="#E5C158"/>
        </svg>
      </div>
    </div>

    <!-- Brand name -->
    <h1 class="brand-name">FORTREX</h1>

    <!-- Single tagline — no trading hints -->
    <p class="stealth-tagline">Access by invitation only.</p>

    <!-- Auth buttons -->
    <div class="auth-buttons">
      <button class="btn-discord" onclick="FORTREX_AUTH.loginWithDiscord()">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Continue with Discord
      </button>

      <button class="btn-google" onclick="handleGoogleSignIn()">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <div class="redirect-notice" id="redirectNotice" style="display:none;">
      Already signed in — taking you inside...
    </div>
  </div>

  <script src="js/dala.js?v=3"></script>
  <script src="js/auth.js?v=5"></script>
  <script>
    // Stealth mode controller
    (function() {
      const trader = FORTREX_AUTH.isLoggedIn();
      const loading = document.getElementById('loadingOverlay');
      const content = document.getElementById('stealthContent');
      const notice = document.getElementById('redirectNotice');

      // If already logged in, redirect to dashboard
      if (trader) {
        notice.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
        loading.classList.add('hidden');
        content.style.display = 'flex';
        return;
      }

      // Not logged in — show stealth landing
      setTimeout(() => {
        loading.classList.add('hidden');
        content.style.display = 'flex';
      }, 600);
    })();

    function handleGoogleSignIn() {
      // Google OAuth — redirect to Google sign-in
      // For now, show a message that Google auth requires the full app
      const btn = document.querySelector('.btn-google');
      btn.textContent = 'Coming Soon';
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
    }
  </script>
</body>
</html>
