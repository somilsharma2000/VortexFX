<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORTREX FX — Session Terminated</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/dala.css">

  <style>
    @keyframes pulseDots {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .amber-pulse {
      display: inline-block;
      color: #ffb829;
      font-size: 14px;
      letter-spacing: 8px;
      animation: pulseDots 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particle-canvas"></canvas>

  <!-- CENTERED SIGN OUT CONTAINER -->
  <div class="auth-container" data-shape="galaxy">
    <div style="text-align: center; max-width: 500px; width: 100%;">

      <!-- CENTERED VIOLET TRIANGLE LOGO -->
      <div style="margin-bottom: 36px;">
        <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" stroke="#8052ff" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
            <polygon points="50,30 65,39 65,61 50,70 35,61 35,39" stroke="#8052ff" stroke-width="1.5" fill="none" stroke-linejoin="round" opacity="0.5"/>
            <path d="M50,42 Q58,45 55,52 Q48,55 45,48 Q47,43 50,42" stroke="#8052ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="2" fill="#8052ff"/>
            <circle cx="50" cy="18" r="3" fill="#8052ff"/>
            <circle cx="78" cy="34" r="3" fill="#8052ff"/>
            <circle cx="78" cy="66" r="3" fill="#8052ff"/>
            <circle cx="50" cy="82" r="3" fill="#8052ff"/>
            <circle cx="22" cy="66" r="3" fill="#8052ff"/>
            <circle cx="22" cy="34" r="3" fill="#8052ff"/>
          </svg>
      </div>

      <!-- PHASE 1 -->
      <div id="phase-1" style="transition: opacity 0.5s ease;">
        <h1 class="heading" style="margin-bottom: 12px;">Signing out...</h1>
        <p class="body-text-muted" style="margin-bottom: 24px;">Thank you for trading in the Fortex FX arena, Commander.</p>
        <div class="amber-pulse">· · ·</div>
      </div>

      <!-- PHASE 2 -->
      <div id="phase-2" style="display: none; opacity: 0; transition: opacity 0.5s ease;">
        <h1 class="heading" style="margin-bottom: 12px;">Session Terminated</h1>
        <p class="body-text-muted" style="margin-bottom: 36px;">You have been safely signed out.</p>

        <div style="display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 48px; flex-wrap: wrap;">
          <a href="signin.html" class="btn-primary">SIGN BACK IN</a>
          <a href="index.html" class="btn-ghost" style="color: #9a9a9a;">RETURN HOME</a>
        </div>

        <div style="font-size: 12px; color: #4a4a4a;">
          Your session has been encrypted and securely terminated.
        </div>
      </div>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/dala.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/psychology.js"></script>
  <script>
    new ParticleField('particle-canvas', { shape: 'cloud', particleCount: 40, ambientCount: 20 });

    setTimeout(() => {
      const p1 = document.getElementById('phase-1');
      const p2 = document.getElementById('phase-2');
      p1.style.opacity = '0';
      setTimeout(() => {
        p1.style.display = 'none';
        p2.style.display = 'block';
        setTimeout(() => {
          p2.style.opacity = '1';
        }, 50);
      }, 500);
    }, 2000);
  </script>
</body>
</html>
